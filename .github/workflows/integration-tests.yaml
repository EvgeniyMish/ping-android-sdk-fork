name: Run integration tests on emulators

on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-latest
      head_sha:
        description: Head commit SHA to check out
        type: string
      head_repo:
        description: Head repository to check out
        type: string
    secrets:
      SLACK_WEBHOOK:
        description: Slack Notifier Incoming Webhook
        required: true
      CODECOV_TOKEN:
        description: Codecov token
        required: true
      E2E_CONFIG:
        description: Variables for the e2e tests
        required: true
      DAVINCI_E2E_CONFIG:
        description: Variables for the DaVinci e2e tests
        required: true

jobs:
  integration-tests:
    runs-on: ${{ inputs.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
           - api-level: 29
             target: default
             arch: x86_64
             channel: stable

    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          repository: ${{ inputs.head_repo || github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Setup config file for e2e tests
        run: |
          echo "${{ secrets.E2E_CONFIG }}" > journey/src/main/assets/test_config.properties
          echo "${{ secrets.DAVINCI_E2E_CONFIG }}" > davinci/src/main/assets/davinci_test_config.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug available Android SDK packages
        run: |
          sdkmanager --list --channel=3 | grep -E "CinnamonBun|android-37|ps16k|google_apis" || true

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.channel }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Execute integration tests
        timeout-minutes: 30
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --rerun-tasks connectedDebugAndroidTestCoverage --stacktrace --no-daemon --continue

      - name: Publish test results
        if: success() || failure()
        uses: dorny/test-reporter@v2
        with:
          name: Integration tests results - API Level ${{ matrix.api-level }} - ${{ matrix.target }}
          path: '**/build/outputs/androidTest-results/**/TEST-*.xml'
          list-suites: all
          list-tests: failed
          fail-on-error: 'true'
          fail-on-empty: 'true'
          reporter: java-junit

      - name: Upload Android Test Report HTML
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-report-${{ matrix.api-level }}-${{ matrix.target }}
          path: '**/build/reports/androidTests/connected/debug/**'

      - name: Find all coverage report files from all modules
        run: |
          echo "COVERAGE_REPORTS=$(echo $(printf '%s,' $(find . | grep test-coverage.xml)))" >> $GITHUB_ENV

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_REPORTS }}
          flags: integration-tests